<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DualTube Studio - YouTube 2〜4窓マルチビューアー</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- YouTube IFrame API -->
    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'Noto Sans JP', 'sans-serif'],
                    }
                }
            }
        };
    </script>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100dvh;
            background-color: #09090b;
            color: #f4f4f5;
            overflow: hidden;
            overscroll-behavior: none;
        }
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #18181b;
        }
        ::-webkit-scrollbar-thumb {
            background: #3f3f46;
            border-radius: 9999px;
        }
        /* ゼロ・リロード絶対配置パネル */
        .stage-panel {
            position: absolute;
            display: flex;
            flex-direction: column;
            background: #121215;
            border: 1px solid #27272a;
            overflow: hidden;
            border-radius: 6px;
        }
        .stage-panel.panel-hidden {
            visibility: hidden !important;
            opacity: 0 !important;
            pointer-events: none !important;
            z-index: -10 !important;
            width: 0 !important;
            height: 0 !important;
        }
        /* IFrame ラッパー */
        .iframe-wrap {
            position: relative;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }
        .iframe-wrap iframe {
            width: 100% !important;
            height: 100% !important;
            border: 0 !important;
            display: block !important;
        }
        /* ドラッグリサイズ中はiframeのポインタイベントを無効化してマウス追従抜けを防止 */
        body.is-dragging iframe {
            pointer-events: none !important;
        }
        body.is-dragging {
            user-select: none !important;
            -webkit-user-select: none !important;
        }
        /* 境界線ドラッグスプリッター */
        .splitter-handle {
            position: absolute;
            z-index: 40;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
            transition: background-color 0.15s ease;
        }
        .splitter-handle:hover,
        .splitter-handle.active {
            background-color: rgba(239, 68, 68, 0.45);
        }
        .splitter-col {
            cursor: col-resize;
        }
        .splitter-col::after {
            content: '';
            width: 2px;
            height: 32px;
            border-radius: 999px;
            background: rgba(161, 161, 170, 0.55);
        }
        .splitter-row {
            cursor: row-resize;
        }
        .splitter-row::after {
            content: '';
            height: 2px;
            width: 32px;
            border-radius: 999px;
            background: rgba(161, 161, 170, 0.55);
        }
        /* レンジスライダー */
        input[type=range] {
            -webkit-appearance: none;
            background: transparent;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 5px;
            cursor: pointer;
            background: #27272a;
            border-radius: 999px;
        }
        input[type=range]::-webkit-slider-thumb {
            height: 14px;
            width: 14px;
            border-radius: 50%;
            background: #ef4444;
            cursor: pointer;
            -webkit-appearance: none;
            margin-top: -4.5px;
        }
    </style>
</head>
<body class="flex flex-col select-none font-sans">

    <!-- トースト通知コンテナ -->
    <div id="toast-box" class="fixed bottom-8 right-4 z-[100] flex flex-col gap-1.5 pointer-events-none max-w-[92vw]"></div>

    <!-- ==========================================
         シンプル1行トップバー
    =========================================== -->
    <header id="top-bar" class="bg-zinc-950 border-b border-zinc-800/90 px-2.5 py-1.5 z-30 shrink-0">
        <div class="max-w-[1920px] mx-auto flex flex-col gap-1.5">
            <!-- メイン1行コントロール -->
            <div class="flex items-center justify-between gap-2 overflow-x-auto">
                
                <!-- 左側: ロゴ・窓数切替(2/3/4窓)・URL管理ボタン・全窓再生 -->
                <div class="flex items-center gap-1.5 shrink-0">
                    <div class="flex items-center gap-1.5 pr-1">
                        <div class="w-6 h-6 rounded-md bg-red-600 flex items-center justify-center shadow">
                            <i class="fa-solid fa-play text-white text-[10px]"></i>
                        </div>
                        <span class="font-bold text-xs tracking-tight text-zinc-100 hidden sm:inline">DualTube</span>
                    </div>

                    <!-- 窓数切替 (デフォルト2窓 / 最大4窓) -->
                    <div class="flex items-center bg-zinc-900 p-0.5 rounded-lg border border-zinc-800">
                        <button onclick="setStreamCount(2)" id="btn-count-2" class="px-2 py-0.5 rounded text-[11px] font-bold transition">2窓</button>
                        <button onclick="setStreamCount(3)" id="btn-count-3" class="px-2 py-0.5 rounded text-[11px] font-bold transition">3窓</button>
                        <button onclick="setStreamCount(4)" id="btn-count-4" class="px-2 py-0.5 rounded text-[11px] font-bold transition">4窓</button>
                    </div>

                    <!-- URL入力バー開閉ボタン -->
                    <button onclick="toggleUrlDrawer()" id="btn-url-drawer" class="px-2.5 py-1 rounded-lg text-[11px] font-semibold border transition flex items-center gap-1.5 bg-zinc-900 hover:bg-zinc-800 text-zinc-200 border-zinc-800" title="URL入力欄を開閉">
                        <i class="fa-solid fa-link text-sky-400 text-[10px]"></i>
                        <span>URL入力</span>
                        <i id="url-drawer-icon" class="fa-solid fa-chevron-down text-[9px] text-zinc-400"></i>
                    </button>

                    <!-- iPhone/iPad対応 全窓同時スタートボタン -->
                    <button onclick="playAllStreams()" class="px-2 py-1 rounded-lg text-[11px] font-semibold bg-zinc-900 hover:bg-emerald-600 text-emerald-400 hover:text-white border border-zinc-800 transition flex items-center gap-1" title="すべての窓を同時再生＆音声同期">
                        <i class="fa-solid fa-play text-[9px]"></i>
                        <span class="hidden md:inline">一括再生</span>
                    </button>
                </div>

                <!-- 中央: 音声排他スイッチャー（選んだ1窓の音声だけを再生）＋ 音量スライダー -->
                <div class="flex items-center gap-1 bg-zinc-900/95 p-0.5 rounded-lg border border-zinc-800 shrink-0">
                    <span class="text-[10px] text-zinc-400 font-medium px-1.5 hidden xl:inline">
                        <i class="fa-solid fa-volume-high text-red-400 mr-0.5"></i>音声:
                    </span>

                    <button onclick="setActiveAudio(0)" id="top-audio-0" class="px-2 py-0.5 rounded-md font-semibold flex items-center gap-1 transition text-[11px]">
                        <img id="top-avatar-0" src="" alt="" class="w-3.5 h-3.5 rounded-full object-cover hidden">
                        <i id="top-audio-icon-0" class="fa-solid fa-volume-high text-[10px]"></i>
                        <span class="ch-label-0 max-w-[76px] truncate">1窓</span>
                    </button>

                    <button onclick="setActiveAudio(1)" id="top-audio-1" class="px-2 py-0.5 rounded-md font-semibold flex items-center gap-1 transition text-[11px]">
                        <img id="top-avatar-1" src="" alt="" class="w-3.5 h-3.5 rounded-full object-cover hidden">
                        <i id="top-audio-icon-1" class="fa-solid fa-volume-xmark text-[10px]"></i>
                        <span class="ch-label-1 max-w-[76px] truncate">2窓</span>
                    </button>

                    <button onclick="setActiveAudio(2)" id="top-audio-2" class="hidden px-2 py-0.5 rounded-md font-semibold items-center gap-1 transition text-[11px]">
                        <img id="top-avatar-2" src="" alt="" class="w-3.5 h-3.5 rounded-full object-cover hidden">
                        <i id="top-audio-icon-2" class="fa-solid fa-volume-xmark text-[10px]"></i>
                        <span class="ch-label-2 max-w-[76px] truncate">3窓</span>
                    </button>

                    <button onclick="setActiveAudio(3)" id="top-audio-3" class="hidden px-2 py-0.5 rounded-md font-semibold items-center gap-1 transition text-[11px]">
                        <img id="top-avatar-3" src="" alt="" class="w-3.5 h-3.5 rounded-full object-cover hidden">
                        <i id="top-audio-icon-3" class="fa-solid fa-volume-xmark text-[10px]"></i>
                        <span class="ch-label-3 max-w-[76px] truncate">4窓</span>
                    </button>

                    <button onclick="setActiveAudio(-1)" id="top-audio-mute" title="全窓ミュート" class="px-1.5 py-0.5 rounded-md text-zinc-400 hover:text-white text-[10px] transition">
                        <i class="fa-solid fa-volume-xmark"></i>
                    </button>
                    <button onclick="setActiveAudio(99)" id="top-audio-all" title="全窓の音声を同時ON（PC向け）" class="hidden lg:inline-block px-1.5 py-0.5 rounded-md text-zinc-400 hover:text-white text-[10px] font-medium transition">
                        全ON
                    </button>

                    <!-- 音量スライダー -->
                    <div class="hidden sm:flex items-center gap-1 pl-1 pr-1.5 border-l border-zinc-800">
                        <input type="range" id="vol-slider" min="0" max="100" value="85" oninput="setMasterVolume(this.value)" class="w-14" title="マスター音量">
                    </div>
                </div>

                <!-- 右側: レイアウト切替 ＋ 自動ライブ追従 ＋ UIロック ＋ UI非表示 -->
                <div class="flex items-center gap-1.5 shrink-0">
                    <!-- レイアウトプリセット -->
                    <div class="flex items-center bg-zinc-900 p-0.5 rounded-lg border border-zinc-800">
                        <button onclick="setLayoutPreset('split-col')" id="btn-layout-split-col" class="px-2 py-0.5 rounded text-[11px] flex items-center gap-1 transition" title="左右独立 (各窓の上部に映像・下部にチャット)">
                            <i class="fa-solid fa-table-columns"></i>
                            <span class="hidden xl:inline">左右独立</span>
                        </button>
                        <button onclick="setLayoutPreset('video-top')" id="btn-layout-video-top" class="px-2 py-0.5 rounded text-[11px] flex items-center gap-1 transition" title="上下分割 (上段に全映像・下段に全チャット)">
                            <i class="fa-solid fa-grip-lines"></i>
                            <span class="hidden xl:inline">上下分割</span>
                        </button>
                        <button onclick="setLayoutPreset('side-chat')" id="btn-layout-side-chat" class="px-2 py-0.5 rounded text-[11px] flex items-center gap-1 transition" title="右チャット (左に全映像・右にチャット)">
                            <i class="fa-solid fa-table-list"></i>
                            <span class="hidden xl:inline">右チャット</span>
                        </button>
                        <button onclick="setLayoutPreset('video-only')" id="btn-layout-video-only" class="px-2 py-0.5 rounded text-[11px] flex items-center gap-1 transition" title="映像のみ最大化 (チャット非表示)">
                            <i class="fa-solid fa-tv"></i>
                            <span class="hidden xl:inline">映像のみ</span>
                        </button>
                    </div>

                    <!-- ライブ自動追従 ON/OFF -->
                    <button onclick="toggleAutoLiveSync()" id="btn-live-sync" class="px-2 py-1 rounded-lg text-[11px] font-semibold border transition flex items-center gap-1" title="ライブ配信が遅れた際に自動で追いつく機能のON/OFF">
                        <i class="fa-solid fa-bolt text-[10px]"></i>
                        <span class="hidden lg:inline" id="live-sync-label">自動追従:ON</span>
                    </button>

                    <!-- YouTube UIロック (透明シールド) ON/OFF -->
                    <button onclick="toggleUiLock()" id="btn-ui-lock" class="px-2 py-1 rounded-lg text-[11px] font-semibold border transition flex items-center gap-1" title="再生中に動画へ触れてもYouTubeのUIを出さずタップで音声切替するロック">
                        <i class="fa-solid fa-shield-halved text-[10px]"></i>
                        <span class="hidden lg:inline" id="ui-lock-label">UIロック:ON</span>
                    </button>

                    <!-- 上部UIを隠す (ショートカット: H) -->
                    <button onclick="setHeaderHidden(true)" class="bg-zinc-900 hover:bg-red-600 text-zinc-300 hover:text-white border border-zinc-800 px-2.5 py-1 rounded-lg text-[11px] font-semibold transition flex items-center gap-1" title="上部バーを隠す (Hキー)">
                        <i class="fa-solid fa-eye-slash text-[10px]"></i>
                        <span class="hidden sm:inline">UIを隠す</span>
                    </button>
                </div>
            </div>

            <!-- 折りたたみ式 URL一括入力トレイ -->
            <div id="url-drawer" class="hidden pt-1.5 border-t border-zinc-800/80">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-1.5" id="top-url-grid">
                    <!-- JSで0〜3スロットの入力行を生成 -->
                </div>
                <div class="flex flex-wrap items-center justify-between gap-2 pt-1.5 text-[11px] text-zinc-400">
                    <div class="flex items-center gap-3">
                        <button onclick="loadDemoStreams()" class="hover:text-amber-300 flex items-center gap-1 transition">
                            <i class="fa-solid fa-wand-magic-sparkles text-amber-400"></i>
                            <span>サンプルライブ配信を一括セット</span>
                        </button>
                        <button onclick="resetSplitRatios()" class="hover:text-zinc-200 flex items-center gap-1 transition">
                            <i class="fa-solid fa-arrows-rotate text-sky-400"></i>
                            <span>分割比率を50:50にリセット</span>
                        </button>
                        <button onclick="copyShareLink()" class="hover:text-emerald-300 flex items-center gap-1 transition">
                            <i class="fa-solid fa-share-nodes text-emerald-400"></i>
                            <span>現在の構成URLをコピー</span>
                        </button>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="clearAllStreams()" class="text-zinc-500 hover:text-red-400 transition">すべてクリア</button>
                        <button onclick="toggleUrlDrawer(false)" class="px-2 py-0.5 rounded bg-zinc-900 border border-zinc-800 text-zinc-300 hover:text-white">閉じる ▲</button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- ==========================================
         メインワークスペース (絶対座標・ゼロリロード)
    =========================================== -->
    <main id="workspace" class="flex-1 w-full relative overflow-hidden bg-zinc-950">
        <!-- 右チャットモード時のチャット表示切替バー (並列 / タブ切替) -->
        <div id="side-chat-header" class="stage-panel panel-hidden bg-zinc-900 border-b border-zinc-800 px-2 flex-row items-center justify-between z-30">
            <div class="flex items-center gap-1 overflow-x-auto py-0.5" id="side-chat-tab-buttons">
                <!-- JSで生成 -->
            </div>
            <button onclick="toggleSideChatMode()" id="btn-side-chat-mode" class="px-2 py-0.5 rounded bg-zinc-800 hover:bg-zinc-700 text-[10px] text-zinc-200 font-semibold shrink-0 transition">
                並列表示に切替
            </button>
        </div>

        <!-- ドラッグスプリッター (縦・横) -->
        <div id="splitter-x" onpointerdown="beginSplitterDrag(event, 'x')" class="splitter-handle splitter-col hidden" title="ドラッグして左右比率を調整"></div>
        <div id="splitter-y" onpointerdown="beginSplitterDrag(event, 'y')" class="splitter-handle splitter-row hidden" title="ドラッグして上下比率を調整"></div>

        <!-- JS初期化時に #v-panel-0..3 と #c-panel-0..3 を生成 -->
    </main>

    <!-- ==========================================
         UI非表示時の「映像・チャットに一切被らない」下部26pxスリムバー
         (flex-colの最下部に配置されるため、映像やコメントと1pxも重なりません)
    =========================================== -->
    <footer id="bottom-slim-bar" class="h-[26px] bg-zinc-950 border-t border-zinc-800 px-2.5 hidden items-center justify-between text-[11px] shrink-0 z-30">
        <div class="flex items-center gap-2 overflow-x-auto">
            <span class="font-bold text-zinc-400 text-[10px] hidden sm:inline">DualTube</span>
            <div class="flex items-center gap-1">
                <span class="text-[10px] text-zinc-500">音声:</span>
                <button onclick="setActiveAudio(0)" id="slim-audio-0" class="px-1.5 py-0.5 rounded text-[10px] font-semibold flex items-center gap-1 transition">
                    <i class="fa-solid fa-volume-high text-[9px]"></i>
                    <span class="ch-label-0 max-w-[70px] truncate">1窓</span>
                </button>
                <button onclick="setActiveAudio(1)" id="slim-audio-1" class="px-1.5 py-0.5 rounded text-[10px] font-semibold flex items-center gap-1 transition">
                    <i class="fa-solid fa-volume-high text-[9px]"></i>
                    <span class="ch-label-1 max-w-[70px] truncate">2窓</span>
                </button>
                <button onclick="setActiveAudio(2)" id="slim-audio-2" class="hidden px-1.5 py-0.5 rounded text-[10px] font-semibold items-center gap-1 transition">
                    <i class="fa-solid fa-volume-high text-[9px]"></i>
                    <span class="ch-label-2 max-w-[70px] truncate">3窓</span>
                </button>
                <button onclick="setActiveAudio(3)" id="slim-audio-3" class="hidden px-1.5 py-0.5 rounded text-[10px] font-semibold items-center gap-1 transition">
                    <i class="fa-solid fa-volume-high text-[9px]"></i>
                    <span class="ch-label-3 max-w-[70px] truncate">4窓</span>
                </button>
            </div>
        </div>

        <div class="flex items-center gap-1.5 shrink-0">
            <button onclick="syncAllStreamsToLive()" class="px-1.5 py-0.5 rounded bg-zinc-900 hover:bg-amber-600 text-amber-400 hover:text-white text-[10px] font-medium transition">
                ⚡最新へ同期
            </button>
            <button onclick="setHeaderHidden(false)" class="px-2 py-0.5 rounded bg-red-600 hover:bg-red-500 text-white font-bold text-[10px] flex items-center gap-1 transition">
                <i class="fa-solid fa-chevron-up text-[8px]"></i>
                <span>上部バーを表示 (H)</span>
            </button>
        </div>
    </footer>

    <script>
        // ==========================================
        // 定数・状態管理 (localStorage 自動保存)
        // ==========================================
        const STORAGE_KEY = 'yt_multiview_stable_v1';

        const SLOT_THEMES = [
            { num: 1, name: '1窓', badgeBg: 'bg-red-600', softBg: 'bg-red-500/15', border: 'border-red-500/40', text: 'text-red-300' },
            { num: 2, name: '2窓', badgeBg: 'bg-sky-600', softBg: 'bg-sky-500/15', border: 'border-sky-500/40', text: 'text-sky-300' },
            { num: 3, name: '3窓', badgeBg: 'bg-emerald-600', softBg: 'bg-emerald-500/15', border: 'border-emerald-500/40', text: 'text-emerald-300' },
            { num: 4, name: '4窓', badgeBg: 'bg-amber-600', softBg: 'bg-amber-500/15', border: 'border-amber-500/40', text: 'text-amber-300' }
        ];

        const DEMO_URLS = [
            'https://www.youtube.com/watch?v=jfKfPfyJRdk', // Lofi Girl
            'https://www.youtube.com/watch?v=4xDzrJKXOOY', // Synthwave Radio
            'https://www.youtube.com/watch?v=5yx6BWlEVcY', // Chillhop Radio
            'https://www.youtube.com/watch?v=rUxyKA_-grg'  // Lofi Sleep
        ];

        function createDefaultSlot() {
            return {
                url: '',
                videoId: '',
                channelName: '',
                title: '',
                avatarUrl: '',
                chatHidden: false
            };
        }

        function createDefaultState() {
            return {
                streamCount: 2,            // 2 | 3 | 4 (デフォルト2窓)
                layout: 'split-col',       // 'split-col' | 'video-top' | 'side-chat' | 'video-only'
                sideChatTabbed: true,      // 右チャットモード時にタブ切替にするか
                activeChatTab: 0,          // 0..3
                splitX: 50,                // 左右比率 (20..80)
                splitY: 58,                // 上下比率 (25..85)
                activeAudio: 0,            // 0..3: 選択窓のみ音声ON, -1: 全ミュート, 99: 全窓ON
                volume: 85,                // 0..100
                autoLiveSync: true,        // ライブ遅延自動1.25倍速追従
                uiLock: true,              // 再生中のYouTube標準UI非表示シールド
                headerHidden: false,       // 上部バー非表示
                urlDrawerOpen: false,      // 上部URLドロワー開閉
                slots: [
                    createDefaultSlot(),
                    createDefaultSlot(),
                    createDefaultSlot(),
                    createDefaultSlot()
                ]
            };
        }

        let state = createDefaultState();

        // ランタイム管理用オブジェクト
        const ytPlayers = [null, null, null, null];
        const playerReady = [false, false, false, false];
        const playerState = [-1, -1, -1, -1];
        const userIntendedPlay = [true, true, true, true];
        const tempUnlock = [false, false, false, false];
        const loadedChatId = ['', '', '', ''];
        const liveTrack = [
            { minGap: Infinity, isSpeeding: false, lastAutoResume: 0 },
            { minGap: Infinity, isSpeeding: false, lastAutoResume: 0 },
            { minGap: Infinity, isSpeeding: false, lastAutoResume: 0 },
            { minGap: Infinity, isSpeeding: false, lastAutoResume: 0 }
        ];

        let ytApiReady = false;
        let lastGlobalInteractionAt = 0;

        // ==========================================
        // 安全な数値クランプ ＆ 状態ロード・保存
        // ==========================================
        function clampNum(val, min, max, fallback) {
            const n = Number(val);
            if (!Number.isFinite(n)) return fallback;
            return Math.max(min, Math.min(max, n));
        }

        function saveState() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
            } catch (_) {}
        }

        function loadState() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (!raw) return;
                const parsed = JSON.parse(raw);
                const def = createDefaultState();

                state.streamCount = [2, 3, 4].includes(Number(parsed.streamCount)) ? Number(parsed.streamCount) : 2;
                state.layout = ['split-col', 'video-top', 'side-chat', 'video-only'].includes(parsed.layout) ? parsed.layout : 'split-col';
                state.sideChatTabbed = parsed.sideChatTabbed !== undefined ? Boolean(parsed.sideChatTabbed) : true;
                state.activeChatTab = clampNum(parsed.activeChatTab, 0, 3, 0);
                state.splitX = clampNum(parsed.splitX, 20, 80, 50);
                state.splitY = clampNum(parsed.splitY, 25, 85, 58);
                state.activeAudio = [-1, 0, 1, 2, 3, 99].includes(Number(parsed.activeAudio)) ? Number(parsed.activeAudio) : 0;
                state.volume = clampNum(parsed.volume, 0, 100, 85);
                state.autoLiveSync = parsed.autoLiveSync !== undefined ? Boolean(parsed.autoLiveSync) : true;
                state.uiLock = parsed.uiLock !== undefined ? Boolean(parsed.uiLock) : true;
                state.headerHidden = false; // 起動時は常に操作しやすいようヘッダー表示
                state.urlDrawerOpen = Boolean(parsed.urlDrawerOpen);

                if (Array.isArray(parsed.slots)) {
                    for (let i = 0; i < 4; i++) {
                        const s = parsed.slots[i] || {};
                        const vid = extractVideoId(s.videoId || s.url || '');
                        state.slots[i] = {
                            url: vid ? (s.url || `https://www.youtube.com/watch?v=${vid}`) : '',
                            videoId: vid || '',
                            channelName: typeof s.channelName === 'string' ? s.channelName : '',
                            title: typeof s.title === 'string' ? s.title : '',
                            avatarUrl: typeof s.avatarUrl === 'string' ? s.avatarUrl : '',
                            chatHidden: Boolean(s.chatHidden)
                        };
                    }
                }
            } catch (_) {
                state = createDefaultState();
            }
        }

        // ==========================================
        // YouTube URL / 動画ID パーサー (11桁検証)
        // ==========================================
        function extractVideoId(input) {
            if (!input || typeof input !== 'string') return '';
            const str = input.trim();
            if (/^[a-zA-Z0-9_-]{11}$/.test(str)) return str;

            try {
                const u = new URL(str.startsWith('http') ? str : `https://${str}`);
                const host = u.hostname.replace(/^(www\.|m\.)/, '');
                if (host === 'youtu.be') {
                    const id = u.pathname.split('/').filter(Boolean)[0];
                    if (id && /^[a-zA-Z0-9_-]{11}$/.test(id)) return id;
                }
                if (host === 'youtube.com' || host === 'youtube-nocookie.com') {
                    const v = u.searchParams.get('v');
                    if (v && /^[a-zA-Z0-9_-]{11}$/.test(v)) return v;
                    const parts = u.pathname.split('/').filter(Boolean);
                    if (parts.length >= 2 && ['live', 'embed', 'shorts', 'v'].includes(parts[0])) {
                        if (/^[a-zA-Z0-9_-]{11}$/.test(parts[1])) return parts[1];
                    }
                }
            } catch (_) {}

            const m = str.match(/(?:v=|\/live\/|\/embed\/|\/shorts\/|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
            return m ? m[1] : '';
        }
