        // ==========================================
        // ゼロ・リロード レイアウト計算エンジン (applyLayoutGeometry)
        // ==========================================
        function setBox(el, leftPct, topPct, widthPct, heightPct, gapPx = 3) {
            if (!el) return;
            el.classList.remove('panel-hidden');
            el.style.left = `calc(${leftPct.toFixed(3)}% + ${gapPx}px)`;
            el.style.top = `calc(${topPct.toFixed(3)}% + ${gapPx}px)`;
            el.style.width = `calc(${widthPct.toFixed(3)}% - ${gapPx * 2}px)`;
            el.style.height = `calc(${heightPct.toFixed(3)}% - ${gapPx * 2}px)`;
        }

        function hideBox(el) {
            if (!el) return;
            el.classList.add('panel-hidden');
        }

        function applyLayoutGeometry() {
            const count = clampNum(state.streamCount, 2, 4, 2);
            const sx = clampNum(state.splitX, 20, 80, 50);
            const sy = clampNum(state.splitY, 25, 85, 58);
            const layout = state.layout;

            const spX = document.getElementById('splitter-x');
            const spY = document.getElementById('splitter-y');
            const sideHeader = document.getElementById('side-chat-header');

            spX.classList.add('hidden');
            spY.classList.add('hidden');
            hideBox(sideHeader);

            // 使用しない窓 (count 以降) を非表示にする
            for (let i = count; i < 4; i++) {
                hideBox(document.getElementById(`v-panel-${i}`));
                hideBox(document.getElementById(`c-panel-${i}`));
            }

            // 列のX座標・幅リストを算出 (2窓の場合は splitX を反映、3〜4窓は均等割)
            function getColWidths(n) {
                if (n === 2) {
                    return [
                        { left: 0, width: sx },
                        { left: sx, width: 100 - sx }
                    ];
                }
                const w = 100 / n;
                const arr = [];
                for (let i = 0; i < n; i++) arr.push({ left: i * w, width: w });
                return arr;
            }

            // 1. 左右独立 (split-col): 各カラムの上部に映像、下部にチャット
            if (layout === 'split-col') {
                const cols = getColWidths(count);
                for (let i = 0; i < count; i++) {
                    const vEl = document.getElementById(`v-panel-${i}`);
                    const cEl = document.getElementById(`c-panel-${i}`);
                    const chatHidden = state.slots[i].chatHidden;

                    if (chatHidden) {
                        setBox(vEl, cols[i].left, 0, cols[i].width, 100);
                        hideBox(cEl);
                    } else {
                        setBox(vEl, cols[i].left, 0, cols[i].width, sy);
                        setBox(cEl, cols[i].left, sy, cols[i].width, 100 - sy);
                    }
                }

                // スプリッター表示
                if (count === 2) {
                    spX.classList.remove('hidden');
                    spX.style.left = `calc(${sx}% - 5px)`;
                    spX.style.top = '0';
                    spX.style.width = '10px';
                    spX.style.height = '100%';
                }
                spY.classList.remove('hidden');
                spY.style.left = '0';
                spY.style.top = `calc(${sy}% - 5px)`;
                spY.style.width = '100%';
                spY.style.height = '10px';
            }

            // 2. 上下分割 (video-top): 上段に全映像、下段に全チャット
            else if (layout === 'video-top') {
                const cols = getColWidths(count);
                const anyChatVisible = state.slots.slice(0, count).some(s => !s.chatHidden);
                const videoH = anyChatVisible ? sy : 100;

                for (let i = 0; i < count; i++) {
                    const vEl = document.getElementById(`v-panel-${i}`);
                    const cEl = document.getElementById(`c-panel-${i}`);
                    setBox(vEl, cols[i].left, 0, cols[i].width, videoH);

                    if (anyChatVisible && !state.slots[i].chatHidden) {
                        setBox(cEl, cols[i].left, sy, cols[i].width, 100 - sy);
                    } else {
                        hideBox(cEl);
                    }
                }

                if (count === 2) {
                    spX.classList.remove('hidden');
                    spX.style.left = `calc(${sx}% - 5px)`;
                    spX.style.top = '0';
                    spX.style.width = '10px';
                    spX.style.height = '100%';
                }
                if (anyChatVisible) {
                    spY.classList.remove('hidden');
                    spY.style.left = '0';
                    spY.style.top = `calc(${sy}% - 5px)`;
                    spY.style.width = '100%';
                    spY.style.height = '10px';
                }
            }

            // 3. 右チャット (side-chat): 左側に全映像、右側にチャット(タブまたは縦並び)
            else if (layout === 'side-chat') {
                const vx = clampNum(state.splitX, 35, 82, 68);
                const cx = 100 - vx;

                // 左側映像の配置 (2窓:上下2段, 3窓:上2+下1, 4窓:2x2グリッド)
                if (count === 2) {
                    setBox(document.getElementById('v-panel-0'), 0, 0, vx, sy);
                    setBox(document.getElementById('v-panel-1'), 0, sy, vx, 100 - sy);
                    spY.classList.remove('hidden');
                    spY.style.left = '0';
                    spY.style.top = `calc(${sy}% - 5px)`;
                    spY.style.width = `${vx}%`;
                    spY.style.height = '10px';
                } else if (count === 3) {
                    setBox(document.getElementById('v-panel-0'), 0, 0, vx / 2, sy);
                    setBox(document.getElementById('v-panel-1'), vx / 2, 0, vx / 2, sy);
                    setBox(document.getElementById('v-panel-2'), 0, sy, vx, 100 - sy);
                } else {
                    setBox(document.getElementById('v-panel-0'), 0, 0, vx / 2, 50);
                    setBox(document.getElementById('v-panel-1'), vx / 2, 0, vx / 2, 50);
                    setBox(document.getElementById('v-panel-2'), 0, 50, vx / 2, 50);
                    setBox(document.getElementById('v-panel-3'), vx / 2, 50, vx / 2, 50);
                }

                // 右側チャットヘッダー (高さ32px相当 = 約4.5%)
                const headerH = 5;
                setBox(sideHeader, vx, 0, cx, headerH);

                if (state.sideChatTabbed) {
                    if (state.activeChatTab >= count) state.activeChatTab = 0;
                    for (let i = 0; i < count; i++) {
                        const cEl = document.getElementById(`c-panel-${i}`);
                        if (i === state.activeChatTab) {
                            setBox(cEl, vx, headerH, cx, 100 - headerH);
                        } else {
                            hideBox(cEl);
                        }
                    }
                } else {
                    const eachH = (100 - headerH) / count;
                    for (let i = 0; i < count; i++) {
                        const cEl = document.getElementById(`c-panel-${i}`);
                        setBox(cEl, vx, headerH + i * eachH, cx, eachH);
                    }
                }

                spX.classList.remove('hidden');
                spX.style.left = `calc(${vx}% - 5px)`;
                spX.style.top = '0';
                spX.style.width = '10px';
                spX.style.height = '100%';
            }

            // 4. 映像のみ最大化 (video-only): チャット全非表示で映像を大画面配置
            else if (layout === 'video-only') {
                for (let i = 0; i < count; i++) {
                    hideBox(document.getElementById(`c-panel-${i}`));
                }
                if (count === 2) {
                    setBox(document.getElementById('v-panel-0'), 0, 0, sx, 100);
                    setBox(document.getElementById('v-panel-1'), sx, 0, 100 - sx, 100);
                    spX.classList.remove('hidden');
                    spX.style.left = `calc(${sx}% - 5px)`;
                    spX.style.top = '0';
                    spX.style.width = '10px';
                    spX.style.height = '100%';
                } else if (count === 3) {
                    setBox(document.getElementById('v-panel-0'), 0, 0, sx, sy);
                    setBox(document.getElementById('v-panel-1'), sx, 0, 100 - sx, sy);
                    setBox(document.getElementById('v-panel-2'), 0, sy, 100, 100 - sy);
                    spX.classList.remove('hidden');
                    spX.style.left = `calc(${sx}% - 5px)`;
                    spX.style.top = '0';
                    spX.style.width = '10px';
                    spX.style.height = `${sy}%`;
                    spY.classList.remove('hidden');
                    spY.style.left = '0';
                    spY.style.top = `calc(${sy}% - 5px)`;
                    spY.style.width = '100%';
                    spY.style.height = '10px';
                } else {
                    setBox(document.getElementById('v-panel-0'), 0, 0, sx, sy);
                    setBox(document.getElementById('v-panel-1'), sx, 0, 100 - sx, sy);
                    setBox(document.getElementById('v-panel-2'), 0, sy, sx, 100 - sy);
                    setBox(document.getElementById('v-panel-3'), sx, sy, 100 - sx, 100 - sy);
                    spX.classList.remove('hidden');
                    spX.style.left = `calc(${sx}% - 5px)`;
                    spX.style.top = '0';
                    spX.style.width = '10px';
                    spX.style.height = '100%';
                    spY.classList.remove('hidden');
                    spY.style.left = '0';
                    spY.style.top = `calc(${sy}% - 5px)`;
                    spY.style.width = '100%';
                    spY.style.height = '10px';
                }
            }

            updateControlHighlights();
        }

        // ==========================================
        // スプリッターのドラッグリサイズ処理
        // ==========================================
        function beginSplitterDrag(e, axis) {
            e.preventDefault();
            const ws = document.getElementById('workspace');
            const rect = ws.getBoundingClientRect();
            if (rect.width <= 0 || rect.height <= 0) return;

            document.body.classList.add('is-dragging');
            const handle = document.getElementById(axis === 'x' ? 'splitter-x' : 'splitter-y');
            if (handle) handle.classList.add('active');

            function onMove(ev) {
                if (axis === 'x') {
                    const pct = ((ev.clientX - rect.left) / rect.width) * 100;
                    state.splitX = clampNum(Math.round(pct * 2) / 2, 20, 80, 50);
                } else {
                    const pct = ((ev.clientY - rect.top) / rect.height) * 100;
                    state.splitY = clampNum(Math.round(pct * 2) / 2, 25, 85, 58);
                }
                applyLayoutGeometry();
            }

            function onUp() {
                document.body.classList.remove('is-dragging');
                if (handle) handle.classList.remove('active');
                window.removeEventListener('pointermove', onMove);
                window.removeEventListener('pointerup', onUp);
                window.removeEventListener('pointercancel', onUp);
                saveState();
            }

            window.addEventListener('pointermove', onMove);
            window.addEventListener('pointerup', onUp);
            window.addEventListener('pointercancel', onUp);
        }

        function resetSplitRatios() {
            state.splitX = state.layout === 'side-chat' ? 68 : 50;
            state.splitY = 58;
            for (let i = 0; i < 4; i++) state.slots[i].chatHidden = false;
            applyLayoutGeometry();
            saveState();
            showToast('画面の分割比率を初期状態にリセットしました', 'info');
        }

        // ==========================================
        // YouTube IFrame Player API 制御 (空のvideoIdでは絶対に初期化しない)
        // ==========================================
        function onYouTubeIframeAPIReady() {
            ytApiReady = true;
            for (let i = 0; i < state.streamCount; i++) {
                if (state.slots[i].videoId) {
                    mountSlotVideoAndChat(i);
                }
            }
        }

        function submitUrlFromSlot(i) {
            const inp = document.getElementById(`slot-input-${i}`);
            if (!inp) return;
            loadStreamByUrl(i, inp.value, true);
        }

        function submitUrlFromTop(i) {
            const inp = document.getElementById(`top-url-input-${i}`);
            if (!inp) return;
            loadStreamByUrl(i, inp.value, true);
        }

        function loadStreamByUrl(i, rawInput, notify = true) {
            const vid = extractVideoId(rawInput);
            if (!vid) {
                showToast(`${i + 1}窓: 有効なYouTube URLまたは11桁の動画IDを入力してください`, 'error');
                return;
            }

            const slot = state.slots[i];
            const changed = slot.videoId !== vid;
            slot.videoId = vid;
            slot.url = `https://www.youtube.com/watch?v=${vid}`;
            if (changed) {
                slot.channelName = '';
                slot.title = '';
                slot.avatarUrl = '';
            }

            userIntendedPlay[i] = true;
            tempUnlock[i] = false;
            liveTrack[i] = { minGap: Infinity, isSpeeding: false, lastAutoResume: 0 };

            // 両方の入力欄を同期
            const topInp = document.getElementById(`top-url-input-${i}`);
            const slotInp = document.getElementById(`slot-input-${i}`);
            if (topInp) topInp.value = slot.url;
            if (slotInp) slotInp.value = slot.url;

            mountSlotVideoAndChat(i);
            saveState();
            syncQueryParams();

            if (notify) {
                showToast(`${i + 1}窓に配信 (ID: ${vid}) を読み込みました`, 'success');
            }
        }

        function mountSlotVideoAndChat(i) {
            const slot = state.slots[i];
            const vid = slot.videoId;
            if (!vid || !/^[a-zA-Z0-9_-]{11}$/.test(vid)) return;

            // 空スロットカードを隠してプレイヤー枠を表示
            document.getElementById(`v-empty-${i}`).classList.add('hidden');
            document.getElementById(`v-player-wrap-${i}`).classList.remove('hidden');
            document.getElementById(`v-live-btn-${i}`).classList.remove('hidden');
            document.getElementById(`v-cc-btn-${i}`).classList.remove('hidden');
            document.getElementById(`v-unlock-btn-${i}`).classList.remove('hidden');

            // チャンネル名・タイトル・アイコンを非同期取得
            fetchChannelInfo(i, vid);

            // チャット埋め込み（同じIDなら再読込しない）
            if (loadedChatId[i] !== vid) {
                mountChatIframe(i, vid);
            }

            // YT.Player の生成または更新
            if (ytApiReady && window.YT && window.YT.Player) {
                createYTPlayerInstance(i, vid);
            }
        }

        function createYTPlayerInstance(i, vid) {
            if (!vid || !/^[a-zA-Z0-9_-]{11}$/.test(vid)) return;

            lastGlobalInteractionAt = Date.now();

            // 既存のプレイヤーが準備完了している場合は loadVideoById で高速切替
            if (ytPlayers[i] && playerReady[i] && typeof ytPlayers[i].loadVideoById === 'function') {
                try {
                    ytPlayers[i].mute();
                    ytPlayers[i].loadVideoById(vid);
                    setTimeout(() => syncAudioToPlayers(), 400);
                    return;
                } catch (_) {}
            }

            // 既存インスタンスがあれば安全に破棄し、新しい子divを生成してマウント
            if (ytPlayers[i] && typeof ytPlayers[i].destroy === 'function') {
                try { ytPlayers[i].destroy(); } catch (_) {}
            }
            ytPlayers[i] = null;
            playerReady[i] = false;
            playerState[i] = -1;
            updateShieldInteractivity(i);

            const wrap = document.getElementById(`v-player-wrap-${i}`);
            wrap.innerHTML = `<div id="yt-mount-${i}"></div>`;

            const pVars = {
                autoplay: 1,
                mute: 1,                     // iOS/Safariで他窓を停止させないため初期起動は必ずミュート
                playsinline: 1,              // iPhoneで勝手にフルスクリーン化するのを防止
                controls: state.uiLock ? 0 : 1,
                rel: 0,
                modestbranding: 1,
                iv_load_policy: 3,
                cc_load_policy: 0,           // 自動字幕オフ
                hl: 'ja'
            };

            if (window.location.origin && window.location.origin.startsWith('http')) {
                pVars.origin = window.location.origin;
            }

            ytPlayers[i] = new YT.Player(`yt-mount-${i}`, {
                width: '100%',
                height: '100%',
                videoId: vid,
                playerVars: pVars,
                events: {
                    onReady: (ev) => {
                        playerReady[i] = true;
                        try {
                            ev.target.mute();
                            ev.target.playVideo();
                        } catch (_) {}
                        disableCaptions(i, false);
                        setTimeout(() => disableCaptions(i, false), 800);
                        setTimeout(() => syncAudioToPlayers(), 350);
                        extractPlayerDataFallback(i, ev.target);
                    },
                    onStateChange: (ev) => {
                        playerState[i] = ev.data;
                        updateShieldInteractivity(i);

                        if (ev.data === YT.PlayerState.PLAYING) {
                            lastGlobalInteractionAt = Date.now();
                            // 再生開始時に自動生成字幕を確実にアンロード
                            disableCaptions(i, false);
                            setTimeout(() => disableCaptions(i, false), 600);
                            setTimeout(() => disableCaptions(i, false), 1800);
                            extractPlayerDataFallback(i, ev.target);

                            // 非選択窓のミュート維持
                            if (state.activeAudio !== i && state.activeAudio !== 99) {
                                try {
                                    if (!ev.target.isMuted()) ev.target.mute();
                                } catch (_) {}
                            }
                        } else if (ev.data === YT.PlayerState.PAUSED) {
                            // iPhone/iPad等で他窓の開始・音声切替の直後(3秒以内)にOSに巻き込まれて停止した場合のみ優しく自動再開
                            const now = Date.now();
                            if (
                                userIntendedPlay[i] &&
                                i < state.streamCount &&
                                (now - lastGlobalInteractionAt < 3200) &&
                                (now - liveTrack[i].lastAutoResume > 4000)
                            ) {
                                liveTrack[i].lastAutoResume = now;
                                setTimeout(() => {
                                    try {
                                        if (state.activeAudio !== i && state.activeAudio !== 99) {
                                            ev.target.mute();
                                        }
                                        ev.target.playVideo();
                                    } catch (_) {}
                                }, 250);
                            }
                        }
                    },
                    onError: () => {
                        // エラー時はシールドを解除してプレイヤー上の表示を確認可能にする
                        playerState[i] = -1;
                        updateShieldInteractivity(i);
                    }
                }
            });
        }

        // ==========================================
        // スマート透明シールド制御 (再生中のみ有効化し、停止・待機中はネイティブ再生ボタンのクリックを妨げない)
        // ==========================================
        function updateShieldInteractivity(i) {
            const shield = document.getElementById(`v-shield-${i}`);
            if (!shield) return;

            const isPlaying = (playerState[i] === 1); // YT.PlayerState.PLAYING === 1
            const shouldEngage = state.uiLock && !tempUnlock[i] && Boolean(state.slots[i].videoId) && isPlaying;

            if (shouldEngage) {
                shield.classList.remove('hidden');
                shield.style.pointerEvents = 'auto';
            } else {
                shield.classList.add('hidden');
                shield.style.pointerEvents = 'none';
            }
        }

        function onShieldClick(i) {
            setActiveAudio(i, true);
            if (state.layout === 'side-chat' && state.sideChatTabbed) {
                selectChatTab(i);
            }
        }

        function togglePlayPause(i) {
            const p = ytPlayers[i];
            if (!p || !playerReady[i]) return;
            try {
                const st = p.getPlayerState();
                if (st === 1 || st === 3) {
                    userIntendedPlay[i] = false;
                    p.pauseVideo();
                } else {
                    userIntendedPlay[i] = true;
                    lastGlobalInteractionAt = Date.now();
                    if (state.activeAudio !== i && state.activeAudio !== 99) p.mute();
                    p.playVideo();
                }
            } catch (_) {}
        }

        function toggleUiLock() {
            state.uiLock = !state.uiLock;
            for (let i = 0; i < 4; i++) {
                tempUnlock[i] = false;
                updateShieldInteractivity(i);
            }
            updateControlHighlights();
            saveState();
            showToast(
                state.uiLock
                    ? '🛡️ UIロックをONにしました（再生中に動画をクリックしてもYouTubeのUIが出ず、音声切替になります）'
                    : '🔓 UIロックをOFFにしました（YouTubeの画質設定やシークバーを直接操作できます）',
                'info'
            );
        }

        function toggleTempUnlock(i) {
            tempUnlock[i] = !tempUnlock[i];
            const btn = document.getElementById(`v-unlock-btn-${i}`);
            if (btn) {
                btn.className = tempUnlock[i]
                    ? 'px-1.5 py-0.5 rounded bg-amber-500 text-black font-bold text-[10px] transition'
                    : 'px-1.5 py-0.5 rounded bg-zinc-800 hover:bg-zinc-700 text-zinc-300 text-[10px] transition';
            }
            updateShieldInteractivity(i);
            showToast(
                tempUnlock[i]
                    ? `${i + 1}窓のYouTube標準UI操作を一時許可しました（画質変更後に再度ボタンを押すとロックに戻ります）`
                    : `${i + 1}窓のUIロックを再有効化しました`,
                'info'
            );
        }

        // ==========================================
        // 再生時の自動字幕 (CC) 強制オフ
        // ==========================================
        function disableCaptions(i, notify = false) {
            const p = ytPlayers[i];
            if (!p || !playerReady[i]) return;
            try {
                if (typeof p.unloadModule === 'function') {
                    p.unloadModule('captions');
                    p.unloadModule('cc');
                }
            } catch (_) {}
            try {
                if (typeof p.setOption === 'function') {
                    p.setOption('captions', 'track', {});
                    p.setOption('cc', 'track', {});
                }
            } catch (_) {}
            if (notify) {
                showToast(`${state.slots[i].channelName || (i + 1) + '窓'} の字幕(CC)をオフにしました`, 'info');
            }
        }

        // ==========================================
        // チャット埋め込み ＆ 別窓ポップアウト
        // ==========================================
        function mountChatIframe(i, vid) {
            if (!vid) return;
            loadedChatId[i] = vid;
            const emptyEl = document.getElementById(`c-empty-${i}`);
            const wrapEl = document.getElementById(`c-frame-wrap-${i}`);

            const host = window.location.hostname || 'localhost';
            const src = `https://www.youtube.com/live_chat?v=${encodeURIComponent(vid)}&embed_domain=${encodeURIComponent(host)}&dark_theme=1`;

            wrapEl.innerHTML = `<iframe src="${src}" title="Live Chat ${i + 1}" referrerpolicy="origin"></iframe>`;
            emptyEl.classList.add('hidden');
            wrapEl.classList.remove('hidden');
        }

        function reloadChat(i) {
            const vid = state.slots[i].videoId;
            if (!vid) return;
            loadedChatId[i] = '';
            mountChatIframe(i, vid);
            showToast(`${state.slots[i].channelName || (i + 1) + '窓'} のチャットを再読み込みしました`, 'info');
        }

        function popoutChat(i) {
            const vid = state.slots[i].videoId;
            if (!vid) {
                showToast(`${i + 1}窓の配信が設定されていません`, 'warning');
                return;
            }
            window.open(
                `https://www.youtube.com/live_chat?is_popout=1&v=${encodeURIComponent(vid)}`,
                `yt_chat_pop_${i}`,
                'width=420,height=680,menubar=no,toolbar=no,location=no,status=no'
            );
        }

        function toggleStreamChat(i) {
            if (state.layout === 'video-only') {
                state.layout = 'split-col';
                state.slots[i].chatHidden = false;
            } else {
                state.slots[i].chatHidden = !state.slots[i].chatHidden;
            }
            applyLayoutGeometry();
            saveState();
        }

        // ==========================================
        // チャンネル名・タイトル・アイコンの自動取得
        // ==========================================
        async function fetchChannelInfo(i, vid) {
            const slot = state.slots[i];
            if (!slot.channelName) {
                slot.channelName = `${i + 1}窓`;
            }
            slot.avatarUrl = `https://i.ytimg.com/vi/${vid}/default.jpg`;
            renderSlotMetadataDOM(i);

            const watchUrl = `https://www.youtube.com/watch?v=${vid}`;
            try {
                let data = null;
                try {
                    const r1 = await fetch(`https://noembed.com/embed?url=${encodeURIComponent(watchUrl)}`);
                    if (r1.ok) data = await r1.json();
                } catch (_) {}

                if (!data || !data.author_name) {
                    const r2 = await fetch(`https://www.youtube.com/oembed?url=${encodeURIComponent(watchUrl)}&format=json`);
                    if (r2.ok) data = await r2.json();
                }

                if (data && state.slots[i].videoId === vid) {
                    if (data.author_name) slot.channelName = data.author_name;
                    if (data.title) slot.title = data.title;
                    if (data.author_url) {
                        const m = data.author_url.match(/youtube\.com\/(@[^/?#]+|channel\/[^/?#]+|c\/[^/?#]+|user\/[^/?#]+)/i);
                        if (m) {
                            const handle = m[1].replace(/^(channel\/|c\/|user\/)/i, '');
                            slot.avatarUrl = `https://unavatar.io/youtube/${encodeURIComponent(handle)}?fallback=https://i.ytimg.com/vi/${vid}/hqdefault.jpg`;
                        }
                    }
                    renderSlotMetadataDOM(i);
                    saveState();
                }
            } catch (_) {}
        }

        function extractPlayerDataFallback(i, player) {
            try {
                if (!player || typeof player.getVideoData !== 'function') return;
                const d = player.getVideoData();
                if (!d) return;
                const slot = state.slots[i];
                let changed = false;
                if (d.author && (!slot.channelName || slot.channelName === `${i + 1}窓`)) {
                    slot.channelName = d.author;
                    changed = true;
                }
                if (d.title && !slot.title) {
                    slot.title = d.title;
                    changed = true;
                }
                if (changed) {
                    renderSlotMetadataDOM(i);
                    saveState();
                }
            } catch (_) {}
        }

        function renderSlotMetadataDOM(i) {
            const slot = state.slots[i];
            const name = slot.channelName || `${i + 1}窓`;
            const title = slot.title || (slot.videoId ? `ID: ${slot.videoId}` : '未設定');
            const avatar = slot.avatarUrl;
            const thumbFallback = slot.videoId ? `https://i.ytimg.com/vi/${slot.videoId}/default.jpg` : '';

            document.querySelectorAll(`.ch-label-${i}`).forEach(el => {
                el.textContent = name;
            });

            const titleEl = document.getElementById(`v-title-${i}`);
            if (titleEl) {
                titleEl.textContent = title;
                titleEl.title = `${name} - ${title}`;
            }

            const imgIds = [`v-avatar-${i}`, `c-avatar-${i}`, `top-avatar-${i}`, `row-avatar-${i}`, `tab-avatar-${i}`];
            imgIds.forEach(id => {
                const img = document.getElementById(id);
                if (!img) return;
                if (avatar && slot.videoId) {
                    img.src = avatar;
                    img.onerror = function () {
                        if (thumbFallback && this.src !== thumbFallback) {
                            this.src = thumbFallback;
                        } else {
                            this.classList.add('hidden');
                        }
                    };
                    img.classList.remove('hidden');
                } else {
                    img.classList.add('hidden');
                }
            });

            const badge = document.getElementById(`v-badge-${i}`);
            const cIcon = document.getElementById(`c-icon-${i}`);
            if (avatar && slot.videoId) {
                if (badge) badge.classList.add('hidden');
                if (cIcon) cIcon.classList.add('hidden');
            } else {
                if (badge) badge.classList.remove('hidden');
                if (cIcon) cIcon.classList.remove('hidden');
            }
        }

        // ==========================================
        // 音声排他スイッチャー (先行ミュート制御でiOSの停止を防止)
        // ==========================================
        function setActiveAudio(targetMode, notify = true) {
            state.activeAudio = targetMode;
            lastGlobalInteractionAt = Date.now();
            syncAudioToPlayers();
            updateControlHighlights();
            saveState();

            if (notify) {
                if (targetMode >= 0 && targetMode < 4) {
                    const ch = state.slots[targetMode].channelName || `${targetMode + 1}窓`;
                    showToast(`🔊 「${ch}」の音声に切り替えました`, 'info');
                } else if (targetMode === -1) {
                    showToast('🔇 すべての窓をミュートにしました', 'info');
                } else if (targetMode === 99) {
                    showToast('🔊 全窓の音声を同時ONにしました', 'info');
                }
            }
        }

        function syncAudioToPlayers() {
            const vol = clampNum(state.volume, 0, 100, 85);
            const mode = state.activeAudio;

            // Step 1: まず音声を出さない窓を先にすべて mute() する (iOS対策)
            for (let i = 0; i < 4; i++) {
                const shouldPlaySound = (i < state.streamCount) && (mode === i || mode === 99);
                if (!shouldPlaySound && ytPlayers[i] && playerReady[i]) {
                    try {
                        ytPlayers[i].mute();
                    } catch (_) {}
                }
            }

            // Step 2: 選択された窓のみ unMute() & setVolume()
            for (let i = 0; i < state.streamCount; i++) {
                const shouldPlaySound = (mode === i || mode === 99);
                if (shouldPlaySound && ytPlayers[i] && playerReady[i]) {
                    try {
                        ytPlayers[i].unMute();
                        ytPlayers[i].setVolume(vol);
                    } catch (_) {}
                }
            }
        }

        function setMasterVolume(val) {
            state.volume = clampNum(val, 0, 100, 85);
            syncAudioToPlayers();
            saveState();
        }

        function playAllStreams() {
            lastGlobalInteractionAt = Date.now();
            for (let i = 0; i < state.streamCount; i++) {
                if (!state.slots[i].videoId) continue;
                userIntendedPlay[i] = true;
                const p = ytPlayers[i];
                if (p && playerReady[i]) {
                    try {
                        p.mute();
                        p.playVideo();
                    } catch (_) {}
                }
            }
            setTimeout(() => syncAudioToPlayers(), 300);
            showToast('▶️ 全窓を一括再生＆音声同期しました', 'success');
        }

        // ==========================================
        // ライブ遅延の自動追従 (シーク連発・暗転を起こさない1.25倍速スムーズ追従)
        // ==========================================
        setInterval(() => {
            for (let i = 0; i < state.streamCount; i++) {
                const p = ytPlayers[i];
                const pill = document.getElementById(`v-live-pill-${i}`);
                if (!p || !playerReady[i] || playerState[i] !== 1) continue;

                try {
                    const dur = p.getDuration();
                    const cur = p.getCurrentTime();
                    if (dur <= 0 || cur <= 0) continue;

                    const rawGap = Math.max(0, dur - cur);
                    if (rawGap > 43200) continue; // 通常アーカイブは除外

                    if (pill) pill.classList.remove('hidden');

                    const tr = liveTrack[i];
                    if (!Number.isFinite(tr.minGap) || rawGap < tr.minGap) {
                        tr.minGap = Math.max(2, rawGap);
                    } else {
                        tr.minGap = tr.minGap * 0.995 + Math.max(2, rawGap) * 0.005;
                    }

                    const drift = Math.max(0, rawGap - tr.minGap);

                    if (!state.autoLiveSync) {
                        if (tr.isSpeeding && typeof p.setPlaybackRate === 'function') {
                            p.setPlaybackRate(1.0);
                            tr.isSpeeding = false;
                        }
                        if (pill) pill.textContent = drift > 6 ? `●LIVE (-${Math.round(drift)}s)` : '●LIVE';
                        continue;
                    }

                    // 18秒以上遅れたら1.25倍速で滑らかに追従し、2.5秒以内に戻ったら1.0倍速へ戻す
                    if (drift > 18) {
                        if (!tr.isSpeeding && typeof p.setPlaybackRate === 'function') {
                            p.setPlaybackRate(1.25);
                            tr.isSpeeding = true;
                        }
                        if (pill) pill.textContent = `⚡1.25x追従 (-${Math.round(drift)}s)`;
                    } else if (drift <= 2.5) {
                        if (tr.isSpeeding && typeof p.setPlaybackRate === 'function') {
                            p.setPlaybackRate(1.0);
                            tr.isSpeeding = false;
                        }
                        if (pill) pill.textContent = '●LIVE';
                    }
                } catch (_) {}
            }
        }, 4000);

        function toggleAutoLiveSync() {
            state.autoLiveSync = !state.autoLiveSync;
            if (!state.autoLiveSync) {
                for (let i = 0; i < 4; i++) {
                    if (liveTrack[i].isSpeeding && ytPlayers[i] && playerReady[i]) {
                        try { ytPlayers[i].setPlaybackRate(1.0); } catch (_) {}
                        liveTrack[i].isSpeeding = false;
                    }
                }
            }
            updateControlHighlights();
            saveState();
            showToast(
                state.autoLiveSync
                    ? '⚡ ライブ自動追従をONにしました（遅れた際に画面を止めず1.25倍速で追いつきます）'
                    : '⏸️ ライブ自動追従をOFFにしました',
                'info'
            );
        }

        function seekStreamToLive(i, notify = true) {
            const p = ytPlayers[i];
            if (!p || !playerReady[i]) return;
            try {
                const dur = p.getDuration();
                if (dur > 0) {
                    if (typeof p.setPlaybackRate === 'function') p.setPlaybackRate(1.0);
                    liveTrack[i].isSpeeding = false;
                    liveTrack[i].minGap = Infinity;
                    p.seekTo(Math.max(0, dur - 2), true);
                    p.playVideo();
                    if (notify) {
                        showToast(`⚡ ${state.slots[i].channelName || (i + 1) + '窓'} を最新のライブ位置へ同期しました`, 'success');
                    }
                }
            } catch (_) {}
        }

        function syncAllStreamsToLive() {
            for (let i = 0; i < state.streamCount; i++) {
                seekStreamToLive(i, false);
            }
            showToast('⚡ すべての窓を最新のライブ位置へ同期しました', 'success');
        }

        // ==========================================
        // 窓数・レイアウト・スロット操作・UI表示切替
        // ==========================================
        function setStreamCount(n) {
            if (![2, 3, 4].includes(n)) return;
            state.streamCount = n;
            if (state.activeAudio >= n && state.activeAudio !== 99) {
                state.activeAudio = 0;
            }

            // 新たに表示された窓にURLが設定済みならマウント、非表示になった窓は一時停止
            for (let i = 0; i < 4; i++) {
                if (i < n) {
                    if (state.slots[i].videoId && !ytPlayers[i]) {
                        mountSlotVideoAndChat(i);
                    }
                } else if (ytPlayers[i] && playerReady[i]) {
                    try {
                        ytPlayers[i].mute();
                        ytPlayers[i].pauseVideo();
                    } catch (_) {}
                }
            }

            applyLayoutGeometry();
            syncAudioToPlayers();
            saveState();
            syncQueryParams();
        }

        function setLayoutPreset(preset) {
            state.layout = preset;
            if (preset === 'side-chat' && state.splitX === 50) {
                state.splitX = 68;
            } else if (preset !== 'side-chat' && state.splitX === 68) {
                state.splitX = 50;
            }
            applyLayoutGeometry();
            saveState();
            syncQueryParams();
        }

        function toggleSideChatMode() {
            state.sideChatTabbed = !state.sideChatTabbed;
            applyLayoutGeometry();
            saveState();
        }

        function selectChatTab(i) {
            state.activeChatTab = i;
            applyLayoutGeometry();
            saveState();
        }

        function toggleUrlDrawer(forceState) {
            state.urlDrawerOpen = forceState !== undefined ? forceState : !state.urlDrawerOpen;
            const drawer = document.getElementById('url-drawer');
            const icon = document.getElementById('url-drawer-icon');
            if (state.urlDrawerOpen) {
                drawer.classList.remove('hidden');
                if (icon) icon.className = 'fa-solid fa-chevron-up text-[9px] text-sky-400';
            } else {
                drawer.classList.add('hidden');
                if (icon) icon.className = 'fa-solid fa-chevron-down text-[9px] text-zinc-400';
            }
            saveState();
        }

        function setHeaderHidden(hide) {
            state.headerHidden = Boolean(hide);
            const topBar = document.getElementById('top-bar');
            const slimBar = document.getElementById('bottom-slim-bar');
            if (state.headerHidden) {
                topBar.classList.add('hidden');
                slimBar.classList.remove('hidden');
                slimBar.classList.add('flex');
            } else {
                topBar.classList.remove('hidden');
                slimBar.classList.add('hidden');
                slimBar.classList.remove('flex');
            }
            applyLayoutGeometry();
        }

        function reloadSlot(i) {
            const vid = state.slots[i].videoId;
            if (!vid) {
                showToast(`${i + 1}窓はURLが未設定です`, 'warning');
                return;
            }
            if (ytPlayers[i] && typeof ytPlayers[i].destroy === 'function') {
                try { ytPlayers[i].destroy(); } catch (_) {}
            }
            ytPlayers[i] = null;
            playerReady[i] = false;
            loadedChatId[i] = '';
            mountSlotVideoAndChat(i);
            showToast(`${i + 1}窓を再読み込みしました`, 'info');
        }

        function clearSlot(i) {
            if (ytPlayers[i] && typeof ytPlayers[i].destroy === 'function') {
                try { ytPlayers[i].destroy(); } catch (_) {}
            }
            ytPlayers[i] = null;
            playerReady[i] = false;
            playerState[i] = -1;
            loadedChatId[i] = '';
            state.slots[i] = createDefaultSlot();

            document.getElementById(`v-player-wrap-${i}`).innerHTML = '';
            document.getElementById(`v-player-wrap-${i}`).classList.add('hidden');
            document.getElementById(`v-empty-${i}`).classList.remove('hidden');
            document.getElementById(`v-live-pill-${i}`).classList.add('hidden');
            document.getElementById(`v-live-btn-${i}`).classList.add('hidden');
            document.getElementById(`v-cc-btn-${i}`).classList.add('hidden');
            document.getElementById(`v-unlock-btn-${i}`).classList.add('hidden');

            document.getElementById(`c-frame-wrap-${i}`).innerHTML = '';
            document.getElementById(`c-frame-wrap-${i}`).classList.add('hidden');
            document.getElementById(`c-empty-${i}`).classList.remove('hidden');

            const topInp = document.getElementById(`top-url-input-${i}`);
            const slotInp = document.getElementById(`slot-input-${i}`);
            if (topInp) topInp.value = '';
            if (slotInp) slotInp.value = '';

            updateShieldInteractivity(i);
            renderSlotMetadataDOM(i);
            saveState();
            syncQueryParams();
        }

        function clearAllStreams() {
            for (let i = 0; i < 4; i++) clearSlot(i);
            showToast('すべての窓をクリアしました', 'info');
        }

        function loadSingleDemo(i) {
            loadStreamByUrl(i, DEMO_URLS[i], true);
        }

        function loadDemoStreams() {
            for (let i = 0; i < state.streamCount; i++) {
                loadStreamByUrl(i, DEMO_URLS[i], false);
            }
            toggleUrlDrawer(false);
            showToast(`${state.streamCount}窓すべてにサンプルライブ配信をセットしました`, 'success');
        }

        async function pasteUrlAndLoad(i) {
            try {
                const text = await navigator.clipboard.readText();
                if (text && extractVideoId(text)) {
                    loadStreamByUrl(i, text, true);
                    return;
                }
            } catch (_) {}
            const slotInp = document.getElementById(`slot-input-${i}`);
            const topInp = document.getElementById(`top-url-input-${i}`);
            const target = (!document.getElementById(`v-empty-${i}`).classList.contains('hidden')) ? slotInp : topInp;
            if (target) {
                if (target === topInp && !state.urlDrawerOpen) toggleUrlDrawer(true);
                target.focus();
                showToast('入力欄を選択しました。Ctrl+V または ペーストでURLを貼り付けてください', 'info');
            }
        }

        // ==========================================
        // ボタン・ラベルのハイライト更新
        // ==========================================
        function updateControlHighlights() {
            const count = state.streamCount;

            // 1. 窓数ボタン
            [2, 3, 4].forEach(n => {
                const b = document.getElementById(`btn-count-${n}`);
                if (!b) return;
                b.className = (n === count)
                    ? 'px-2 py-0.5 rounded text-[11px] font-bold bg-red-600 text-white shadow transition'
                    : 'px-2 py-0.5 rounded text-[11px] font-medium text-zinc-400 hover:text-white transition';
            });

            // 2. 3窓・4窓の入力行・音声ボタンの表示切替
            for (let i = 0; i < 4; i++) {
                const show = i < count;
                const row = document.getElementById(`top-url-row-${i}`);
                const topA = document.getElementById(`top-audio-${i}`);
                const slimA = document.getElementById(`slim-audio-${i}`);
                const tabB = document.getElementById(`side-tab-btn-${i}`);

                if (row) row.classList.toggle('hidden', !show);
                if (topA) {
                    topA.classList.toggle('hidden', !show);
                    topA.classList.toggle('flex', show);
                }
                if (slimA) {
                    slimA.classList.toggle('hidden', !show);
                    slimA.classList.toggle('flex', show);
                }
                if (tabB) {
                    tabB.classList.toggle('hidden', !show);
                    tabB.classList.toggle('flex', show);
                }
            }

            // 3. 音声ボタンの状態
            const mode = state.activeAudio;
            for (let i = 0; i < 4; i++) {
                const t = SLOT_THEMES[i];
                const isOn = (mode === i || mode === 99);
                const show = i < count;

                const topBtn = document.getElementById(`top-audio-${i}`);
                const topIcon = document.getElementById(`top-audio-icon-${i}`);
                const vBtn = document.getElementById(`v-audio-btn-${i}`);
                const slimBtn = document.getElementById(`slim-audio-${i}`);

                if (topBtn && show) {
                    topBtn.className = isOn
                        ? `flex px-2 py-0.5 rounded-md font-bold items-center gap-1 transition text-[11px] ${t.badgeBg} text-white shadow`
                        : 'flex px-2 py-0.5 rounded-md font-medium items-center gap-1 transition text-[11px] text-zinc-400 hover:text-zinc-200';
                }
                if (topIcon) {
                    topIcon.className = isOn ? 'fa-solid fa-volume-high text-[10px]' : 'fa-solid fa-volume-xmark text-[10px]';
                }
                if (vBtn) {
                    vBtn.className = isOn
                        ? `px-1.5 py-0.5 rounded text-[10px] font-bold flex items-center gap-1 transition ${t.badgeBg} text-white`
                        : 'px-1.5 py-0.5 rounded text-[10px] font-medium flex items-center gap-1 transition bg-zinc-800 text-zinc-400 hover:text-white';
                    vBtn.innerHTML = `<i class="fa-solid ${isOn ? 'fa-volume-high' : 'fa-volume-xmark'} text-[9px]"></i><span class="hidden md:inline">${isOn ? '音声ON' : 'ミュート'}</span>`;
                }
                if (slimBtn && show) {
                    slimBtn.className = isOn
                        ? `flex px-1.5 py-0.5 rounded text-[10px] font-bold items-center gap-1 transition ${t.badgeBg} text-white`
                        : 'flex px-1.5 py-0.5 rounded text-[10px] font-medium items-center gap-1 transition text-zinc-400 hover:text-white';
                }
            }

            const muteBtn = document.getElementById('top-audio-mute');
            const allBtn = document.getElementById('top-audio-all');
            if (muteBtn) {
                muteBtn.className = mode === -1
                    ? 'px-1.5 py-0.5 rounded-md bg-amber-600 text-white text-[10px] font-bold transition'
                    : 'px-1.5 py-0.5 rounded-md text-zinc-400 hover:text-white text-[10px] transition';
            }
            if (allBtn) {
                allBtn.className = mode === 99
                    ? 'hidden lg:inline-block px-1.5 py-0.5 rounded-md bg-emerald-600 text-white text-[10px] font-bold transition'
                    : 'hidden lg:inline-block px-1.5 py-0.5 rounded-md text-zinc-400 hover:text-white text-[10px] font-medium transition';
            }

            // 4. レイアウトボタンのハイライト
            ['split-col', 'video-top', 'side-chat', 'video-only'].forEach(p => {
                const b = document.getElementById(`btn-layout-${p}`);
                if (!b) return;
                b.className = (state.layout === p)
                    ? 'px-2 py-0.5 rounded text-[11px] font-bold flex items-center gap-1 bg-zinc-700 text-white transition'
                    : 'px-2 py-0.5 rounded text-[11px] font-medium flex items-center gap-1 text-zinc-400 hover:text-white transition';
            });

            // 5. 右チャットタブのハイライト
            const sideModeBtn = document.getElementById('btn-side-chat-mode');
            if (sideModeBtn) {
                sideModeBtn.textContent = state.sideChatTabbed ? '並列表示に切替' : 'タブ表示に切替';
            }
            for (let i = 0; i < 4; i++) {
                const tb = document.getElementById(`side-tab-btn-${i}`);
                if (!tb || i >= count) continue;
                const active = state.sideChatTabbed && state.activeChatTab === i;
                tb.className = active
                    ? `flex px-2.5 py-0.5 rounded text-[11px] font-bold items-center gap-1.5 transition shrink-0 ${SLOT_THEMES[i].badgeBg} text-white`
                    : 'flex px-2.5 py-0.5 rounded text-[11px] font-medium items-center gap-1.5 transition shrink-0 bg-zinc-800 text-zinc-400 hover:text-white';
            }

            // 6. 自動追従 & UIロックボタン
            const liveBtn = document.getElementById('btn-live-sync');
            const liveLbl = document.getElementById('live-sync-label');
            if (liveBtn && liveLbl) {
                liveLbl.textContent = state.autoLiveSync ? '自動追従:ON' : '自動追従:OFF';
                liveBtn.className = state.autoLiveSync
                    ? 'px-2 py-1 rounded-lg text-[11px] font-semibold border transition flex items-center gap-1 bg-emerald-600/20 text-emerald-300 border-emerald-500/40'
                    : 'px-2 py-1 rounded-lg text-[11px] font-semibold border transition flex items-center gap-1 bg-zinc-900 text-zinc-400 border-zinc-800';
            }

            const lockBtn = document.getElementById('btn-ui-lock');
            const lockLbl = document.getElementById('ui-lock-label');
            if (lockBtn && lockLbl) {
                lockLbl.textContent = state.uiLock ? 'UIロック:ON' : 'UIロック:OFF';
                lockBtn.className = state.uiLock
                    ? 'px-2 py-1 rounded-lg text-[11px] font-semibold border transition flex items-center gap-1 bg-sky-600/20 text-sky-300 border-sky-500/40'
                    : 'px-2 py-1 rounded-lg text-[11px] font-semibold border transition flex items-center gap-1 bg-zinc-900 text-zinc-400 border-zinc-800';
            }
        }

        // ==========================================
        // URLクエリパラメータ同期 & 共有リンクコピー
        // ==========================================
        function syncQueryParams() {
            try {
                const url = new URL(window.location.href);
                url.searchParams.set('w', String(state.streamCount));
                url.searchParams.set('layout', state.layout);
                for (let i = 0; i < 4; i++) {
                    if (state.slots[i].videoId) {
                        url.searchParams.set(`v${i + 1}`, state.slots[i].videoId);
                    } else {
                        url.searchParams.delete(`v${i + 1}`);
                    }
                }
                window.history.replaceState({}, '', url.toString());
            } catch (_) {}
        }

        function copyShareLink() {
            syncQueryParams();
            const shareUrl = window.location.href;
            const ta = document.createElement('textarea');
            ta.value = shareUrl;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
            showToast('現在のマルチ窓構成URLをクリップボードにコピーしました！', 'success');
        }

        function showToast(msg, type = 'info') {
            const box = document.getElementById('toast-box');
            if (!box) return;
            const el = document.createElement('div');
            const styles = {
                success: 'border-emerald-500/50 bg-zinc-900/95 text-emerald-300',
                error: 'border-red-500/50 bg-zinc-900/95 text-red-300',
                warning: 'border-amber-500/50 bg-zinc-900/95 text-amber-300',
                info: 'border-sky-500/50 bg-zinc-900/95 text-sky-300'
            };
            el.className = `px-3 py-2 rounded-xl border shadow-xl text-xs font-medium transition-all duration-200 ${styles[type] || styles.info}`;
            el.textContent = msg;
            box.appendChild(el);
            setTimeout(() => {
                el.style.opacity = '0';
                setTimeout(() => el.remove(), 200);
            }, 2600);
        }

        // ==========================================
        // アプリケーション初期化
        // ==========================================
        window.addEventListener('DOMContentLoaded', () => {
            buildWorkspaceDOM();
            loadState();

            // クエリパラメータ指定があれば反映
            try {
                const params = new URLSearchParams(window.location.search);
                const w = Number(params.get('w'));
                if ([2, 3, 4].includes(w)) state.streamCount = w;
                const l = params.get('layout');
                if (['split-col', 'video-top', 'side-chat', 'video-only'].includes(l)) state.layout = l;

                for (let i = 0; i < 4; i++) {
                    const v = extractVideoId(params.get(`v${i + 1}`) || '');
                    if (v) {
                        state.slots[i].videoId = v;
                        state.slots[i].url = `https://www.youtube.com/watch?v=${v}`;
                    }
                }
            } catch (_) {}

            // ボリューム・URLドロワー状態を反映
            const volSlider = document.getElementById('vol-slider');
            if (volSlider) volSlider.value = state.volume;
            toggleUrlDrawer(state.urlDrawerOpen);

            // レイアウト計算を実行
            applyLayoutGeometry();

            // 保存されていた各スロットを復元
            for (let i = 0; i < 4; i++) {
                const s = state.slots[i];
                if (s.videoId) {
                    const topInp = document.getElementById(`top-url-input-${i}`);
                    const slotInp = document.getElementById(`slot-input-${i}`);
                    if (topInp) topInp.value = s.url;
                    if (slotInp) slotInp.value = s.url;
                    renderSlotMetadataDOM(i);
                    if (i < state.streamCount) {
                        mountSlotVideoAndChat(i);
                    }
                }
            }

            // キーボードショートカット (Hキーで上部UI表示/非表示、1〜4キーで音声切替)
            window.addEventListener('keydown', (e) => {
                if (['INPUT', 'TEXTAREA'].includes(document.activeElement?.tagName)) return;
                if (e.key === 'h' || e.key === 'H') {
                    setHeaderHidden(!state.headerHidden);
                } else if (['1', '2', '3', '4'].includes(e.key) && !e.ctrlKey && !e.metaKey) {
                    const idx = Number(e.key) - 1;
                    if (idx < state.streamCount) setActiveAudio(idx, true);
                }
            });
        });
    </script>
</body>
</html>
